# Resolved dynamically as effect.<id>.name / effect.<id>.description for every id in AtmosphereEffects.ids.
# suppress inspection "UnusedProperty"
effect.fireflies.name=Fireflies
# suppress inspection "UnusedProperty"
effect.fireflies.description=Warm fireflies wandering through a summer night. They rise and brighten when something succeeds and scatter when it fails.
# suppress inspection "UnusedProperty"
effect.sakura.name=Sakura
# suppress inspection "UnusedProperty"
effect.sakura.description=Cherry blossom petals tumbling in a spring breeze. A success lifts them in an updraft; a failure sends a gust through them.
# suppress inspection "UnusedProperty"
effect.snow.name=Snow
# suppress inspection "UnusedProperty"
effect.snow.description=Soft snowflakes falling through a quiet winter evening, near ones larger and faster than far ones. A success lifts them; a failure gusts them sideways.
# suppress inspection "UnusedProperty"
effect.rain.name=Rain
# suppress inspection "UnusedProperty"
effect.rain.description=Fine rain streaking down in layers, splashing where the nearer drops land. A success eases the rain; a failure brings a stormy gust with a brief flash of brightness.
# suppress inspection "UnusedProperty"
effect.starfield.name=Starfield
# suppress inspection "UnusedProperty"
effect.starfield.description=A twinkling night sky with a rare shooting star, best on dark themes and softer on light ones. A success lifts the stars and sends a shooting star; a failure makes the sky shiver.
# suppress inspection "UnusedProperty"
effect.autumn.name=Autumn Leaves
# suppress inspection "UnusedProperty"
effect.autumn.description=Warm amber and rust leaves swinging down like a pendulum and slowly turning. A success lifts them in an updraft; a failure sends a gust through them.
# suppress inspection "UnusedProperty"
effect.bubbles.name=Bubbles
# suppress inspection "UnusedProperty"
effect.bubbles.description=Thin bubbles wobbling upwards through still water, the larger ones faster. A success sends them up in a rush; a failure pushes them aside in one current.
# suppress inspection "UnusedProperty"
effect.dust.name=Dust Motes
# suppress inspection "UnusedProperty"
effect.dust.description=Tiny specks floating in a beam of afternoon light, hanging almost still and shimmering as they turn. A success lifts them; a failure stirs them sideways.

