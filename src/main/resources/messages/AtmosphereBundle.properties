settings.reactToActivity=React to IDE activity
settings.reactToActivity.comment=Particles slow down while you are idle, speed up during builds, indexing, runs and Gradle sync, then celebrate a success or shiver on a failure, including test runs, commits and pushes. Colours never change.
settings.reactToTyping=React to typing
settings.reactToTyping.comment=Particles stir a little faster while you type quickly and settle again after a pause. Keystrokes are only observed, never altered.
settings.preview.success=Preview Success
settings.preview.failure=Preview Failure
settings.preview.comment=Previews play on the open IDE windows with the currently applied atmosphere.
settings.pointerMode=Mouse pointer:
# Resolved dynamically as settings.pointerMode.<name> for every PointerMode.
# suppress inspection "UnusedProperty"
settings.pointerMode.AVOID=Particles avoid the pointer
# suppress inspection "UnusedProperty"
settings.pointerMode.ATTRACT=Particles gather around the pointer
# suppress inspection "UnusedProperty"
settings.pointerMode.OFF=Ignore the pointer
settings.pointerMode.comment=A mouse click puffs nearby particles outward and scrolling an editor sends a gust through them. The pointer is only observed; clicks, scrolling and movement reach the IDE unchanged.
settings.caretAnchor=Gather particles near the caret
settings.caretAnchor.comment=A few particles drift towards the text caret of the active editor and hover around it. Off while the pointer is ignored or motion is reduced.
settings.pauseOnFocusLoss=Pause when the IDE window is in the background
settings.reduceMotion=Reduce motion
settings.reduceMotion.comment=Very slow, low frame rate motion without success bursts and failure gusts.
