settings.reactToActivity=React to IDE activity (indexing, builds, run, project sync)
settings.pauseOnFocusLoss=Pause when IDE loses focus
settings.activity=Activity reactions
settings.activity.shared=Enable reactions to use these settings. They apply to all atmospheres after Apply; editing them does not trigger a preview.
settings.activity.triggers=Tracked completions: IDE builds, Run/Debug processes exiting with code 0, indexing, and external project sync/tasks (including Gradle). Arbitrary background actions and terminal commands are not tracked.
settings.envelope.movement=Movement envelope
settings.envelope.movement.description=Shapes how particles slow down when you are idle and speed up during tracked IDE activity. Normal animation speed is set above.
settings.envelope.movement.attack.description=Time to reach the full idle slowdown or activity speedup.
settings.envelope.movement.decay.description=Time to settle from the full speed change to the Sustain level. Has no visible effect when Sustain is 1.
settings.envelope.movement.sustain.description=Amount of speed change held while idle or busy: 0 = normal speed, 1 = full slowdown or speedup. This is a level, not a duration.
settings.envelope.movement.release.description=Time to return to normal speed when activity finishes or you resume input.
settings.envelope.successPulse=Success pulse envelope
settings.envelope.successPulse.description=Briefly brightens existing particles after a tracked operation succeeds. It does not add particles or change their speed; the pulse can be subtle at low intensity.
settings.envelope.successPulse.attack.description=Time to reach peak extra brightness.
settings.envelope.successPulse.decay.description=Time to fade from peak brightness to the Sustain level.
settings.envelope.successPulse.sustain.description=Extra brightness remaining after Decay: 0 = none, 1 = peak. The pulse then releases automatically; this is not a holding duration.
settings.envelope.successPulse.release.description=Time to fade the remaining brightness to normal. Has no visible effect when Sustain is 0; then Decay does all the fading.
settings.envelope.attack=Attack (seconds):
